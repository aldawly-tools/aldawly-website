<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191d"><title>معاينة الماركات | الدولي للعدد</title><style>
*{box-sizing:border-box}body{margin:0;background:#111317;color:#f7f7f8;font-family:Tahoma,Arial,sans-serif}.page{max-width:1100px;margin:auto;padding:34px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.kicker{color:#f04a50;font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:clamp(30px,5vw,52px);margin:8px 0 7px;font-weight:900}.sub{color:#aeb3bc;margin:0;font-size:15px}.mark{width:54px;height:54px;border-radius:15px;background:#d71920;display:grid;place-items:center;font-size:27px;font-weight:900}.search{display:flex;align-items:center;gap:12px;background:#22262d;border:1px solid #383e48;border-radius:15px;padding:0 17px;height:58px;margin:26px 0 20px}.search span{font-size:22px;color:#aab0ba}.search input{width:100%;background:none;border:0;outline:0;color:white;font-size:16px;font-family:inherit}.search input::placeholder{color:#9299a4}.tools{display:flex;justify-content:space-between;align-items:center;margin:0 2px 15px;color:#c8cbd1;font-size:13px}.tools b{color:#fff;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.brand{position:relative;min-height:176px;border:1px solid #343a44;border-radius:18px;background:linear-gradient(145deg,#292d34,#1d2026);padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:#fff;overflow:hidden;transition:.2s}.brand:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#d71920;opacity:.09;filter:blur(30px);left:-50px;top:-55px}.brand:hover{border-color:#d71920;transform:translateY(-2px);box-shadow:0 12px 28px #0005}.brand-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.num{font-size:11px;color:#888f9b;letter-spacing:1px}.count{border-radius:30px;background:#343941;color:#f4f4f5;padding:7px 11px;font-size:12px;font-weight:800}.logo-wrap{height:82px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.logo-wrap img{width:148px;height:66px;max-width:82%;object-fit:contain;background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:7px 12px;box-shadow:0 5px 15px #0002}.logo-wrap .riss-logo{width:170px;height:66px}.brand[data-name="riss"]{border-color:#6b343a}.brand[data-name="riss"]:before{background:#e51b2b;opacity:.16}.word{font-weight:1000;font-size:clamp(22px,4vw,34px);letter-spacing:-1px}.knipex{color:#f4f4f4}.koken{color:#f4434c}.hazet{color:#f2f2f2;letter-spacing:2px}.lux{color:#f0444b}.modeco{background:#f5ec23;color:#151515;border:2px solid #111;border-radius:5px;padding:3px 12px;font-size:25px}.normex{color:#41a9df}.brand-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff16;padding-top:12px;position:relative;z-index:1}.brand-foot strong{font-size:16px}.arrow{color:#f04a50;font-size:20px}.loading{grid-column:1/-1;text-align:center;color:#aeb3bc;padding:35px 12px}.empty{display:none;color:#adb3bd;text-align:center;padding:30px}.note{color:#777f8a;text-align:center;font-size:12px;margin-top:22px}@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.brand{min-height:205px}.page{padding-top:48px}}@media(max-width:380px){.page{padding:24px 13px}.brand{min-height:155px;padding:13px}.grid{gap:9px}.logo-wrap{height:68px}}
</style></head><body><main class="page"><header class="top"><div><div class="kicker">DAWLY TOOLS · ORIGINAL & IMPORTED</div><h1>عالم الماركات</h1><p class="sub">اختار الماركة واكتشف أدواتها الاحترافية</p></div><div class="mark">د</div></header><label class="search"><span>⌕</span><input id="brandSearch" type="search" placeholder="ابحث عن اسم الماركة..." aria-label="ابحث عن ماركة"></label><div class="tools"><b>اكتشف الماركات</b><span>اختيار سريع حسب العلامة التجارية</span></div><section class="grid" id="brandGrid"><div class="loading">جاري تحميل جميع الماركات...</div></section><div class="empty" id="empty">لا توجد ماركة بهذا الاسم</div><p class="note">معاينة تصميم مقترح لصفحة الماركات · لا يؤثر على صفحة المتجر الحالية</p></main><script src="firebase-config.js"></script>
<script type="module" src="product-cloud.js"></script>
<script>
const input=document.getElementById('brandSearch'),grid=document.getElementById('brandGrid'),empty=document.getElementById('empty');
function key(v){return String(v||'').trim().toLocaleLowerCase().replace(/[أإآ]/g,'ا').replace(/[ـ\\u064B-\\u065F]/g,'').replace(/[\\s._-]/g,'');}
function slug(v){return key(v).replace(/[^a-z0-9]/g,'');}
function renderBrands(products){
 const map=new Map();
 (Array.isArray(products)?products:[]).forEach(p=>{const brand=String(p.brand||'').trim();if(!brand)return;const k=key(brand);if(!map.has(k))map.set(k,{name:brand,count:0,logoId:String(p.brandLogoImageId||'')});const item=map.get(k);item.count++;if(!item.logoId&&p.brandLogoImageId)item.logoId=String(p.brandLogoImageId);});
 const brands=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'en'));
 grid.innerHTML='';
 brands.forEach((b,i)=>{
  const a=document.createElement('a');a.className='brand';a.dataset.name=key(b.name);a.href='products.html?brand='+encodeURIComponent(b.name)+'#products';
  const head=document.createElement('div');head.className='brand-head';
  const no=document.createElement('span');no.className='num';no.textContent=String(i+1).padStart(2,'0')+' / BRAND';
  const count=document.createElement('span');count.className='count';count.textContent=b.count+' '+(b.count===1?'منتج':'منتجات');head.append(no,count);
  const visual=document.createElement('div');visual.className='logo-wrap';
  const known={'koken':'assets/brands/koken.webp','luxtools':'assets/brands/lux-tools.webp','modeco':'assets/brands/modeco.webp','normex':'assets/brands/normex.webp','riss':'assets/brands/riss.webp','bahco':'assets/brands/bahco.webp','gesipa':'assets/brands/gesipa.webp'};
  const src=known[slug(b.name)];
  if(src){const img=document.createElement('img');img.src=src;img.alt=b.name;visual.append(img);}
  else if(b.logoId){const img=document.createElement('img');img.alt=b.name;img.style.background='#fff';visual.append(img);if(window.DAWLY_LOAD_PRODUCT_IMAGE)window.DAWLY_LOAD_PRODUCT_IMAGE(b.logoId).then(url=>{if(url)img.src=url;}).catch(()=>{});}
  else {const mark=document.createElement('span');mark.className='word';mark.textContent=b.name;visual.append(mark);}
  const foot=document.createElement('div');foot.className='brand-foot';const name=document.createElement('strong');name.textContent=b.name;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↖';foot.append(name,arrow);a.append(head,visual,foot);grid.append(a);
 });
 filterBrands();
 if(!brands.length)grid.innerHTML='<div class="loading">لم يتم العثور على ماركات في الكتالوج الحالي.</div>';
}
function filterBrands(){const q=key(input.value),cards=[...grid.querySelectorAll('.brand')];let n=0;cards.forEach(c=>{const show=c.dataset.name.includes(q);c.style.display=show?'flex':'none';if(show)n++;});empty.style.display=n?'none':'block';}
input.addEventListener('input',filterBrands);
window.addEventListener('dawly-products-updated',e=>renderBrands(e.detail));
window.addEventListener('dawly-catalog-ready',()=>{if(Array.isArray(window.DAWLY_PRODUCTS))renderBrands(window.DAWLY_PRODUCTS);});
if(Array.isArray(window.DAWLY_PRODUCTS))renderBrands(window.DAWLY_PRODUCTS);
</script></body></html>
