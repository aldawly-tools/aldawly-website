<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d71920"><title>اطلب منتج مش موجود | الدولي للعدد</title>
<link rel="stylesheet" href="store.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202833;font-family:Tahoma,Arial,sans-serif}.request-wrap{width:min(100% - 28px,720px);margin:32px auto}.request-card{background:#fff;border:1px solid #e3e7ec;border-radius:20px;padding:24px;box-shadow:0 8px 28px #1b26350d}.request-head{background:linear-gradient(120deg,#a90f18,#df2028);color:#fff;padding:25px;border-radius:17px;margin-bottom:18px}.request-head h1{font-size:24px;margin:0 0 8px}.request-head p{margin:0;line-height:1.8;color:#ffe8e8}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input,textarea{width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid #d6dce3;border-radius:11px;background:#fff}textarea{min-height:95px;resize:vertical}.hint{font-size:12px;color:#737d88;line-height:1.8}.submit{width:100%;border:0;border-radius:12px;padding:15px;background:#d71920;color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.submit:disabled{opacity:.6}.status{padding:12px;border-radius:10px;background:#f4f6f8;margin-top:13px;line-height:1.8;font-size:14px}.status:empty{display:none}.preview{max-width:150px;max-height:150px;object-fit:contain;display:block;margin-top:9px;border:1px solid #e5e8ec;border-radius:10px}.back{display:inline-block;margin-bottom:14px;color:#a90f18;text-decoration:none;font-weight:700}@media(max-width:600px){.request-wrap{margin:14px auto}.request-card{padding:16px}.request-head{padding:20px}.request-head h1{font-size:21px}}
</style></head>
<body><main class="request-wrap">
<a class="back" href="products.html">‹ العودة للمنتجات</a>
<section class="request-head"><h1>مش لاقي اللي بتدور عليه؟ 🔍</h1><p>ابعتلنا اسم المنتج أو صورته، وفريق الدولي هيتواصل معاك لمعرفة التوفر والسعر.</p></section>
<section class="request-card">
<form id="requestForm">
<div class="field"><label for="productName">اسم المنتج أو الموديل *</label><input id="productName" maxlength="120" required placeholder="مثال: مفتاح عزم 1/2 بوصة"></div>
<div class="field"><label for="quantity">الكمية المطلوبة *</label><input id="quantity" type="number" min="1" max="99999" value="1" required></div>
<div class="field"><label for="phone">رقم واتساب للتواصل *</label><input id="phone" type="tel" inputmode="tel" maxlength="20" required placeholder="01xxxxxxxxx"></div>
<div class="field"><label for="requestImage">صورة المنتج (اختياري)</label><input id="requestImage" type="file" accept="image/*"><p class="hint">ارفع صورة واضحة للمنتج إن وجدت، وسيتم تصغيرها تلقائيًا قبل الإرسال.</p><img id="imagePreview" class="preview" hidden alt="معاينة الصورة"></div>
<div class="field"><label for="notes">تفاصيل إضافية (اختياري)</label><textarea id="notes" maxlength="700" placeholder="المقاس، الماركة، الاستخدام أو أي تفاصيل تساعدنا..."></textarea></div>
<button class="submit" id="submitBtn" type="submit">إرسال طلب توفير المنتج</button><div class="status" id="formStatus" role="status" aria-live="polite"></div>
</form>
</section></main>
<script src="firebase-config.js?v=20261122-product-requests"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const $=id=>document.getElementById(id), form=$("requestForm"), btn=$("submitBtn"), status=$("formStatus"), fileInput=$("requestImage");
let db=null, imageData="";
try{const cfg=window.DAWLY_FIREBASE_CONFIG||{};if(cfg.projectId)db=getFirestore(initializeApp(cfg));}catch(e){console.error(e)}
function say(t){status.textContent=t}
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);let data=canvas.toDataURL("image/jpeg",.68);if(data.length>700000)data=canvas.toDataURL("image/jpeg",.48);if(data.length>850000)reject(new Error("حجم الصورة كبير؛ اختر صورة أصغر."));else resolve(data)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("تعذر قراءة الصورة."))};img.src=url})}
fileInput.addEventListener("change",async()=>{imageData="";const f=fileInput.files&&fileInput.files[0];if(!f){$("imagePreview").hidden=true;return}try{imageData=await compressImage(f);$("imagePreview").src=imageData;$("imagePreview").hidden=false;say("")}catch(e){fileInput.value="";say(e.message)}});
form.addEventListener("submit",async e=>{e.preventDefault();if(!db){say("تعذر الاتصال بقاعدة البيانات. حاول مرة أخرى لاحقًا.");return}const name=$("productName").value.trim(),phone=$("phone").value.trim(),quantity=Number($("quantity").value),notes=$("notes").value.trim();if(!name||!phone||!Number.isInteger(quantity)||quantity<1){say("راجع اسم المنتج والكمية ورقم واتساب.");return}btn.disabled=true;btn.textContent="جارٍ إرسال الطلب...";say("");try{await addDoc(collection(db,"productRequests"),{productName:name,quantity,customerPhone:phone,notes,imageData:imageData||"",status:"new",source:"website",createdAt:serverTimestamp()});form.reset();imageData="";$("imagePreview").hidden=true;say("تم استلام طلبك بنجاح ❤️ فريق الدولي هيتواصل معاك على واتساب بعد مراجعة الطلب.");}catch(err){console.error(err);say("لم نتمكن من حفظ الطلب. قد تحتاج قاعدة البيانات إلى تفعيل صلاحية إرسال طلبات المنتجات.");}finally{btn.disabled=false;btn.textContent="إرسال طلب توفير المنتج"}});
</script></body></html>
