<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>طلبات توفير المنتجات | إدارة الدولي</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#202833;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(100% - 24px,1000px);margin:22px auto}.head{background:linear-gradient(120deg,#a90f18,#df2028);color:white;padding:20px;border-radius:16px}.head h1{margin:0 0 7px;font-size:22px}.head p{margin:0;color:#ffe5e5;line-height:1.8}.card{background:#fff;border:1px solid #e3e7ec;border-radius:15px;padding:16px;margin-top:14px}.btn{border:0;border-radius:9px;padding:11px 14px;background:#d71920;color:white;font:inherit;font-weight:700;cursor:pointer}.btn.light{background:#f0f2f5;color:#333}.status{padding:10px;background:#fff7df;color:#66500b;border-radius:9px;margin-top:10px;line-height:1.8}.list{display:grid;gap:12px;margin-top:14px}.item{border:1px solid #e4e8ed;border-radius:13px;padding:14px;background:white}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.item h3{margin:0 0 7px;font-size:17px}.muted{color:#687381;font-size:13px;line-height:1.9}.item img{width:120px;height:120px;object-fit:contain;border:1px solid #e5e8ec;border-radius:10px;margin-top:9px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tools select{font:inherit;padding:10px;border:1px solid #d6dce3;border-radius:9px;flex:1;min-width:150px}.login{display:grid;gap:10px}.hidden{display:none!important}.phone{direction:ltr;display:inline-block}@media(max-width:600px){.wrap{margin:10px auto}.head{padding:17px}.item{padding:12px}}</style></head>
<body><main class="wrap"><header class="head"><h1>طلبات توفير المنتجات 🔍</h1><p>تابع المنتجات التي طلب العملاء توفيرها وحدّث حالة كل طلب.</p></header>
<section id="loginCard" class="card login"><p>سجّل الدخول بحساب Google المصرّح له بإدارة المتجر.</p><button class="btn" id="loginBtn">دخول بحساب Google</button><div id="loginStatus" class="status"></div></section>
<section id="manager" class="hidden"><div class="card top"><strong id="count">طلبات العملاء</strong><div class="tools" style="margin:0"><button class="btn light" id="refreshBtn">تحديث</button><a class="btn light" href="admin.html" style="text-decoration:none">لوحة الإدارة</a></div></div><div id="list" class="list"></div></section></main>
<script src="firebase-config.js?v=20261122-product-requests"></script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import{getFirestore,collection,getDocs,query,orderBy,doc,updateDoc}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const $=id=>document.getElementById(id),cfg=window.DAWLY_FIREBASE_CONFIG||{},admins=new Set(["elgoharemahmoud@gmail.com","ahmedelgohare90@gmail.com"]);let auth,db;
const labels={new:"جديد",contacted:"تم التواصل",sourcing:"جاري التوفير",completed:"مكتمل",cancelled:"ملغي"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){try{return v&&v.toDate?v.toDate().toLocaleString("ar-EG"): "وقت الإرسال غير متاح"}catch{return ""}}
async function load(){const box=$("list");box.textContent="جارٍ تحميل الطلبات...";try{const snap=await getDocs(query(collection(db,"productRequests"),orderBy("createdAt","desc")));$("count").textContent="إجمالي الطلبات: "+snap.size;if(!snap.size){box.textContent="لا توجد طلبات حتى الآن.";return}box.innerHTML=snap.docs.map(d=>{const x=d.data(),image=x.imageData?'<img src="'+esc(x.imageData)+'" alt="صورة المنتج المطلوب">':"";return '<article class="item" data-id="'+esc(d.id)+'"><div class="top"><div><h3>'+esc(x.productName)+'</h3><div class="muted">الكمية: '+esc(x.quantity)+' · '+esc(date(x.createdAt))+'</div><div class="muted">واتساب: <a class="phone" href="https://wa.me/'+esc(String(x.customerPhone||"").replace(/\D/g,""))+'" target="_blank" rel="noopener">'+esc(x.customerPhone)+'</a></div></div><strong>'+esc(labels[x.status]||x.status||"جديد")+'</strong></div><p class="muted">'+esc(x.notes||"لا توجد تفاصيل إضافية")+'</p>'+image+'<div class="tools"><select aria-label="حالة الطلب">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+((x.status||"new")===k?"selected":"")+'>'+v+'</option>').join("")+'</select><button class="btn" data-save>حفظ الحالة</button></div></article>'}).join("");box.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",async()=>{const card=b.closest("[data-id]"),sel=card.querySelector("select");b.disabled=true;try{await updateDoc(doc(db,"productRequests",card.dataset.id),{status:sel.value,updatedAt:new Date()});b.textContent="تم الحفظ";}catch(e){alert("تعذر تحديث الحالة. راجع صلاحيات قاعدة البيانات.");}finally{b.disabled=false}}));}catch(e){console.error(e);box.textContent="تعذر تحميل الطلبات. تأكد من إضافة قواعد productRequests إلى Firestore."}}
try{const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user){$("manager").classList.add("hidden");$("loginCard").classList.remove("hidden");return}if(!user.emailVerified||!admins.has((user.email||"").toLowerCase())){await signOut(auth);$("loginStatus").textContent="هذا الحساب غير مصرح له.";return}$("loginCard").classList.add("hidden");$("manager").classList.remove("hidden");await load()})}catch(e){$("loginStatus").textContent="تعذر تجهيز Firebase."}
$("loginBtn").addEventListener("click",async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("loginStatus").textContent="تعذر تسجيل الدخول: "+e.message}});
$("refreshBtn").addEventListener("click",load);
</script></body></html>
