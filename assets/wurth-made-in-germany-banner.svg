<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Würth — Made in Germany</title>
<desc id="desc">Wide black and red Würth banner with prominent Made in Germany lettering and German flag stripe, without the square emblem.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#15191f"/><stop offset=".52" stop-color="#050608"/><stop offset="1" stop-color="#11151b"/></linearGradient>
 <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#ff3442"/><stop offset=".5" stop-color="#bd0012"/><stop offset="1" stop-color="#ff3442"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="600" rx="54" fill="url(#bg)"/>
<ellipse cx="800" cy="20" rx="600" ry="100" fill="#e00018" opacity=".20" filter="url(#glow)"/>
<path d="M54 10H1546Q1590 10 1590 54V546Q1590 590 1546 590H54Q10 590 10 546V54Q10 10 54 10Z" fill="none" stroke="url(#edge)" stroke-width="8"/>
<path d="M70 16H1530" stroke="#ff5360" stroke-opacity=".5" stroke-width="3"/>
<text x="800" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="205" font-weight="900" letter-spacing="2" fill="#fff" filter="url(#shadow)">WÜRTH</text>
<path d="M190 315H1410" stroke="#fff" stroke-opacity=".22" stroke-width="3"/>
<g transform="translate(235 355)">
 <path d="M0 0H390L360 34H0Z" fill="#050505"/>
 <path d="M390 0H780L750 34H360Z" fill="#e40019"/>
 <path d="M780 0H1170L1140 34H750Z" fill="#ffcc00"/>
</g>
<text x="800" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="1" fill="#fff" filter="url(#shadow)">Made in Germany</text>
</svg>